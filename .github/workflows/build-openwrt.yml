name: Build OpenWrt for Redmi AX3000T

# 触发方式：
#  1. 推送到 main / master 分支
#  2. 在 GitHub 仓库页面 Actions 标签页手动点 "Run workflow"
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 检出本仓库（包含 config/、files/、.github/）
      - name: Checkout
        uses: actions/checkout@v4

      # 释放 runner 磁盘空间（OpenWrt 全量编译需要 ~10GB）
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h

      # 增加 swap（可选，失败不阻塞编译；7GB 内存编译 OpenWrt 足够）
      - name: Add swap
        run: |
          free -h
          if ! swapon --show | grep -q swapfile; then
            sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none 2>/dev/null || true
            sudo chmod 600 /swapfile 2>/dev/null || true
            sudo mkswap /swapfile 2>/dev/null && sudo swapon /swapfile 2>/dev/null && echo "swap enabled" || echo "swap skipped (not critical)"
          fi
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex \
            gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
            zlib1g-dev zstd

      # 下载源码缓存（dl/ 目录），二次编译可复用
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ github.run_id }}
          restore-keys: |
            openwrt-dl-

      - name: Clone source and update feeds
        run: |
          git clone --depth=1 --branch rework-24.10 \
            https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 下载 MTK 闭源源码包（conninfra/warp/mt_wifi/datconf）
      # 这些包没有 PKG_SOURCE_URL，源码托管在 hanwckf/immortalwrt-mt798x 的 dl/ 目录
      # 首选 git 稀疏克隆（有完整性校验）；失败则 raw 下载并校验文件大小
      - name: Download closed-source packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/openwrt/dl"
          if git clone --depth=1 --filter=blob:none --sparse --branch openwrt-21.02 \
              https://github.com/hanwckf/immortalwrt-mt798x.git /tmp/mtk-dl 2>/dev/null; then
            cd /tmp/mtk-dl
            git sparse-checkout set dl
            cp dl/* "$GITHUB_WORKSPACE/openwrt/dl/"
            echo "closed-source packages fetched via sparse clone"
          else
            echo "sparse clone failed, falling back to raw download with size check"
            declare -A sizes=(
              [mt79xx_conninfra_20231229-f2fa25.tar.xz]=49228
              [mt79xx_20220907-8b55f5.tar.xz]=18009876
              [mt79xx_20231229-4012a0.tar.xz]=17740332
              [mt79xx_20250408-705eb4.tar.xz]=18150972
              [warp_20221209-3e6ae1-src.tar.xz]=309700
              [warp_20231229-5f71ec.tar.xz]=310956
              [warp_20250408-5f71ec.tar.xz]=312772
              [datconf-6bb733f7.tar.bz2]=12798
              [datconf-757f9679.tar.bz2]=13114
            )
            for f in "${!sizes[@]}"; do
              curl -sL --retry 3 --connect-timeout 20 -o "$GITHUB_WORKSPACE/openwrt/dl/$f" \
                "https://raw.githubusercontent.com/hanwckf/immortalwrt-mt798x/openwrt-21.02/dl/$f"
              actual=$(stat -c%s "$GITHUB_WORKSPACE/openwrt/dl/$f")
              if [ "$actual" != "${sizes[$f]}" ]; then
                echo "size mismatch for $f: got $actual, expected ${sizes[$f]}"
                exit 1
              fi
            done
            echo "closed-source packages fetched via raw download"
          fi
          echo "===== dl contents ====="
          ls -la "$GITHUB_WORKSPACE/openwrt/dl/"

      # 应用定制配置（闭源驱动 + 中文界面，去插件）
      - name: Apply config
        run: |
          cp config/ax3000t.config openwrt/.config
          cd openwrt
          make defconfig

      # 内置功率解锁工具到固件 /usr/bin/txpwr.sh
      - name: Install txpwr tool into firmware
        run: |
          mkdir -p openwrt/files/usr/bin
          cp files/usr/bin/txpwr.sh openwrt/files/usr/bin/txpwr.sh
          chmod +x openwrt/files/usr/bin/txpwr.sh

      - name: Build firmware
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee ../build.log

      # 编译失败时，自动提取错误摘要输出到工作流顶部，便于快速定位
      - name: Extract error summary (on failure)
        if: failure()
        run: |
          echo "===== ERROR SUMMARY (last error lines) ====="
          grep -n -E "Error [0-9]|ERROR|error:|make\[[0-9]+\].*\*\*\*|failed|FAILED" ../build.log | tail -40
          echo "===== TAIL OF BUILD LOG ====="
          tail -60 ../build.log

      - name: Package firmware artifacts
        run: |
          mkdir -p firmware
          cd openwrt/bin/targets/mediatek/filogic/
          cp xiaomi_mi-router-ax3000t* sha256sums "$GITHUB_WORKSPACE/firmware/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          ls -la firmware/

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax3000t-openwrt-24.10
          path: |
            firmware/
            build.log
          if-no-files-found: warn
